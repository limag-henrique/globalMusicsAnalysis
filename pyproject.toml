[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "chart-observatory"
version = "0.1.0"
description = "Rights-gated, reproducible, cross-platform music chart research foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "polars>=1.32,<2",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=21,<22",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "scipy>=1.16,<2",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.48,<2",
  "structlog>=25.4,<26",
  "tenacity>=9.1,<10",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "pytest-postgresql>=7.0,<8",
  "ruff>=0.12,<1",
  "testcontainers[postgres]>=4.12,<5",
]

[project.scripts]
chart-observatory = "chart_observatory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chart_observatory"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "integration: requires PostgreSQL or another external process",
  "contract: exercises an adapter against local fixtures",
  "live: performs an explicitly authorized live provider call",
]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*",
  "ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["chart_observatory"]
