services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chart_observatory
      POSTGRES_USER: chart_observatory
      POSTGRES_PASSWORD: local_development_only
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chart_observatory -d chart_observatory"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - chart_observatory_postgres:/var/lib/postgresql/data

volumes:
  chart_observatory_postgres:

